<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftBox - Kategoriler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single&family=Honk&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Kategoriler CSS Dosyası -->
    <link rel="stylesheet" href="kategoriler.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="dashboard-container">
        <!-- Üst Bar -->
        <div class="top-header">
            <div class="logo-area" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <img src="Logo.png" alt="Logo" onclick="toggleMobileSidebar()" title="Kategorileri Aç/Kapat" onerror="this.style.display='none'">
                <span onclick="resetToHome()" title="Ana Sayfaya Dön">GiftBox</span>
            </div>
            <button class="gift-box-btn" onclick="openCartModal()" title="Hediye Kutum">
                <img src="Logo.png" alt="Kutu Logo" onerror="this.src='https://via.placeholder.com/30?text=🎁'">
                <span class="badge" id="cartCount">0</span>
            </button>
        </div>

        <div class="main-body">
            <!-- Sol Menü -->
            <div class="sidebar">
                <h3>Kategoriler</h3>
                <ul class="category-list" id="categoryList"></ul>
            </div>
            <!-- Sağ İçerik -->
            <div class="content-area">
                <h2 class="content-title" id="contentTitle">Hoş Geldiniz!</h2>
                <div id="contentBody">
                    <p class="info-msg">Logoya tıklayınca sol tarafta açılacak olan kategorilerden birine tıklayarak hediyeleri incelemeye ve kutunu doldurmaya başlayabilirsin! </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Ürün Detay Modalı -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeProductModal()">✕</button>
            <img id="modalImg" src="" alt="">
            <div class="modal-title" id="modalName"></div>
            <button class="add-to-box-btn" onclick="addToBox()">Hediye Kutuna Ekle </button>
        </div>
    </div>

    <!-- Hediye Kutum İçerik Modalı -->
    <div class="modal-overlay" id="cartModal">
        <div class="cart-modal-content">
            <button class="close-modal" onclick="closeCartModal()">✕</button>
            <h2 class="cart-title-center">Hediye Kutundaki Ürünler </h2>
            <div id="cartItemsList">
                <p class="info-msg" style="text-align: center;">Kutun henüz boş. Ürün eklemeye başla! </p>
            </div>
            
            <!-- BURAYA EKLEYECEKSİN KNK: Listenin hemen altında ve ortalanmış şekilde -->
            <div style="text-align: center; margin-top: 20px;">
                <button id="completeBoxBtn" onclick="completeBox()" class="complete-btn" style="display: none;">Tamamla</button>
            </div>

        </div>
    </div>

    <!-- Kategoriler JS Dosyası -->
    <script src="kategoriler.js"></script>
</body>
</html>
